# Enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Status widgets for left (central) display
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y

# Dedicated work queue for smoother display updates
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Enable External Power (powers OLED display VCC rail on nice!nano)
CONFIG_ZMK_EXT_POWER=y

# Boost Bluetooth transmit power for stable wireless connection & split sync
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
